version: "3"
services:
  db:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # TODO: configura tu imagen de base de datos, te recomendamos una de estas:
    # https://hub.docker.com/_/mongo
    # https://hub.docker.com/_/postgres
    # https://hub.docker.com/_/mysql
    networks:
      - private
  node:
    # image: node:14-alpine3.15 # https://hub.docker.com/_/node/
    # user: node
    # working_dir: /home/node/app
    build: .
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD}
      # index.js se conecta con DB_MONGO (no con DB_URL); "db" es el nombre
      # del servicio de mongo en esta misma red, no localhost
      DB_MONGO: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@db:27017/test?authSource=admin
    volumes:
      - ./:/home/node/app # montamos el codigo en el HOME del usuario _node_
    expose:
      - 8080 # nuestra app corre en el puerto 8080
    ports:
      # mapeamos el puerto 8080 de nuestro contenedor al puerto 80 de nuestra
      # máquina
      - 8080:8080
    # reinstalamos las dependencias y levantamos el servidor
    # command: bash -c 'rm -rf node_modules && npm install && npm start'
    depends_on:
      - db
    networks:
      - public
      - private
networks:
  public:
    internal: false
  private:
    internal: true
